version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: togetherflix_postgres
    restart: always
    environment:
      POSTGRES_USER: togetherflix
      POSTGRES_PASSWORD: romantic_secret
      POSTGRES_DB: togetherflix
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U togetherflix -d togetherflix']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
