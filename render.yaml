# Keep the repository root as the build root: both apps use file:../shared.
# Create a Neon Free database separately; Render Free Postgres expires.
services:
  - type: web
    name: annahflix-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: node deploy/build.mjs backend
    startCommand: node deploy/start.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: TMDB_ACCESS_TOKEN
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ALLOW_HTTP_STREAMS
        value: "false"

  - type: web
    name: annahflix-web
    runtime: static
    buildCommand: node deploy/build.mjs web
    staticPublishPath: mobile/dist
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: EXPO_PUBLIC_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /index.html
        name: Cache-Control
        value: no-cache
